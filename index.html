<script>
(() => {
const supported = ["en-GB", "en-US", "de-DE"];
const fallback = "en-US";
const palettes = ["teal", "indigo", "rose", "amber", "forest", "ocean", "violet", "copper", "graphite", "candy"];
const paletteStorageKey = "passwordGeneratorPaletteOverride";

function canonicalLocale(value) {
try {
return Intl.getCanonicalLocales(String(value).replace("_", "-"))[0];
} catch {
return "";
}
}

function resolveLocale(languages) {
const candidates = Array.isArray(languages) ? languages : [languages];

for (const raw of candidates) {
const locale = canonicalLocale(raw);
if (supported.includes(locale)) return locale;
}

for (const raw of candidates) {
const locale = canonicalLocale(raw);
const base = locale.split("-")[0];
if (base === "de") return "de-DE";
if (base === "en") return "en-US";
}

return fallback;
}

function resolvePalette() {
try {
const stored = localStorage.getItem(paletteStorageKey);
if (palettes.includes(stored)) return stored;
} catch {
}

return palettes[0];
}

const locale = resolveLocale(navigator.languages || navigator.language || fallback);
const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches;

document.documentElement.lang = locale;
document.documentElement.dataset.theme = prefersDark ? "dark" : "light";
document.documentElement.dataset.palette = resolvePalette();
})();

--shadow: rgba(0, 0, 0, .48);
--danger: #ffb4ab;
}

* {
box-sizing: border-box;
}

html {
min-inline-size: 20rem;
}

body {
margin: 0;
padding: var(--page-pad);
background: var(--bg);
color: var(--fg);
font-size: var(--text-base);
line-height: 1.5;
}

main {
width: min(100%, var(--content-max));
margin-inline: auto;
display: grid;
gap: var(--space-lg);
}

.header-row {
display: grid;
gap: var(--space-sm);
justify-items: center;
text-align: center;
}

.header-content {
display: grid;
grid-template-columns: minmax(0, 1fr) auto;
gap: var(--space-lg);
align-items: center;
inline-size: 100%;
text-align: start;
}

.header-copy {
min-inline-size: 0;
display: grid;
gap: var(--space-xs);
font-size: var(--text-sm);
}

.top-controls {
display: flex;
flex: 0 0 auto;
flex-direction: column;
gap: var(--space-xs);
justify-content: center;
align-items: center;
min-inline-size: 0;
}

.theme-toggle {
inline-size: var(--icon-control-size);
block-size: var(--icon-control-size);
padding: 0;
font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI Symbol", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
font-size: 1.15rem;
font-feature-settings: normal;
line-height: 1;
}

.language-control {
position: relative;
display: inline-flex;
align-items: center;
}

.language-control select {
appearance: none;
-webkit-appearance: none;
inline-size: var(--icon-control-size);
block-size: var(--icon-control-size);
padding: 0;
border: 1px solid var(--border);
border-radius: var(--radius-sm);
background: var(--secondary-bg);
color: var(--fg);
font: inherit;
font-weight: 650;
line-height: 1;
text-align: center;
text-align-last: center;
cursor: pointer;
}

.language-control select:focus-visible {
outline: 2px solid var(--focus);
outline-offset: 2px;
}

.sr-only {
position: absolute;
inline-size: 1px;
block-size: 1px;
overflow: hidden;
clip-path: inset(50%);
white-space: nowrap;
}

h1,
h2,
p {
margin: 0;
}

h1 {
position: relative;
max-inline-size: 48rem;
padding-block-end: var(--space-xs);
font-size: clamp(1.85rem, 1.18rem + 3vw, 3rem);
line-height: 1.08;
letter-spacing: 0;
font-weight: 820;
text-wrap: balance;
}

h1::after {
content: "";
position: absolute;
inset-inline: 22%;
inset-block-end: 0;
block-size: .2rem;
border-radius: 999px;
background: linear-gradient(90deg, transparent, var(--accent), transparent);
}

h2:not(.sr-only) {
display: flex;
flex-wrap: wrap;
align-items: center;
gap: var(--space-2xs);
margin-block-end: var(--space-sm);
font-size: var(--text-lg);
line-height: 1.2;
letter-spacing: 0;
font-weight: 720;
}

.card {
border: 1px solid var(--border);
border-radius: var(--radius-lg);
padding: var(--space-lg);
background: linear-gradient(145deg, var(--card-bg), var(--accent-soft));
box-shadow: 0 .5rem 1.4rem var(--shadow);
}

.section-block {
display: grid;
gap: var(--space-md);
}

.result-card {
display: grid;
gap: var(--space-lg);
}

.settings-panel {
display: grid;
grid-template-columns: max-content minmax(0, 1fr);
gap: var(--space-md) var(--space-lg);
align-items: start;
}

label {
display: flex;
flex-wrap: wrap;
gap: var(--space-xs);
align-items: center;
min-inline-size: 0;
line-height: 1.35;
}

input[type="checkbox"] {
appearance: none;
-webkit-appearance: none;
position: relative;
inline-size: 1.12rem;
block-size: 1.12rem;
flex: 0 0 auto;
margin: 0;
border: 1.5px solid var(--border);
border-radius: .35rem;
background: var(--bg);
color: var(--button-fg);
cursor: pointer;
display: grid;
place-content: center;
transition: background-color 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
}

input[type="checkbox"]::after {
content: "";
inline-size: .34rem;
block-size: .58rem;
border: solid currentColor;
border-width: 0 .14rem .14rem 0;
transform: translateY(-0.06rem) rotate(45deg) scale(0);
transform-origin: center;
transition: transform 120ms ease;
}

input[type="checkbox"]:checked {
background: var(--button-bg);
border-color: var(--button-bg);
}

input[type="checkbox"]:checked::after {
transform: translateY(-0.06rem) rotate(45deg) scale(1);
}

input[type="checkbox"]:focus-visible {
outline: 2px solid var(--focus);
outline-offset: 2px;
}

input[type="number"] {
inline-size: 5rem;
padding: 0.42rem 0.5rem;
border-radius: var(--radius-sm);
border: 1px solid var(--border);
font: inherit;
background: var(--bg);
color: var(--fg);
}

#length {
inline-size: 4.75rem;
}

.length-control {
display: grid;
grid-template-columns: auto auto;
align-items: start;
justify-content: start;
gap: var(--space-sm);
font-weight: 650;
}

.length-control input {
grid-column: 1 / -1;
}

.control-label,
.password-label {
display: inline-flex;
align-items: center;
gap: var(--space-xs);
font-weight: 650;
}

.group-fieldset {
min-inline-size: 0;
margin: 0;
padding: 0;
border: 0;
display: grid;
gap: var(--space-md);
}

.group-legend {
display: flex;
flex-wrap: wrap;
align-items: center;
gap: var(--space-2xs);
padding: 0;
font-size: var(--text-base);
font-weight: 720;
line-height: 1.25;
}

.group-options {
display: grid;
grid-template-columns: repeat(2, minmax(0, 1fr));
gap: var(--space-sm);
margin-block-start: var(--space-md);
}

.group-option {
display: grid;
grid-template-columns: auto minmax(0, 1fr) auto;
align-items: center;
gap: var(--space-xs);
padding: 0.62rem 0.7rem;
border: 1px solid var(--soft-border);
border-radius: var(--radius-sm);
background: var(--secondary-bg);
min-block-size: 3.2rem;
}

.group-option:has(input:checked) {
border-color: var(--accent-border);
background: var(--secondary-hover-bg);
}

.group-label {
display: block;
font-weight: 650;
line-height: 1.3;
}

input[type="text"] {
inline-size: 100%;
padding: 0.7rem 0.8rem;
border-radius: var(--radius-md);
border: 1px solid var(--border);
font: 500 var(--text-base) ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
overflow: hidden;
text-overflow: ellipsis;
background: var(--bg);
color: var(--fg);
}

#password {
inline-size: auto;
min-inline-size: min(100%, 12rem);
max-inline-size: 100%;
cursor: copy;
}

button {
padding: var(--control-pad-block) var(--control-pad-inline);
border: 0;
border-radius: var(--radius-sm);
font: inherit;
font-weight: 650;
cursor: pointer;
background: var(--button-bg);
color: var(--button-fg);
transition: background-color 120ms ease, border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
}

button:hover {
background: var(--button-hover-bg);
}

button:active,
.github-link:active {
transform: translateY(1px);
}

button.secondary,
.github-link {
background: var(--secondary-bg);
color: var(--fg);
border: 1px solid var(--accent-border);
}

button.secondary:hover,
.github-link:hover {
background: var(--secondary-hover-bg);
}

.header-link-row {
display: flex;
justify-content: center;
}

.github-link {
display: inline-flex;
align-items: center;
justify-content: center;
inline-size: fit-content;
padding: 0.45rem 0.7rem;
border-radius: var(--radius-sm);
font-size: var(--text-xs);
font-weight: 720;
line-height: 1;
text-decoration: none;
box-shadow: inset 0 0 0 1px var(--accent-border);
transition: background-color 120ms ease, border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
}

.github-link:focus-visible {
outline: 2px solid var(--focus);
outline-offset: 2px;
}

.actions {
display: flex;
flex-wrap: wrap;
gap: var(--space-sm);
justify-content: flex-end;
align-items: center;
}

.password-box {
position: relative;
display: grid;
gap: var(--space-sm);
justify-items: start;
}

.stats {
display: grid;
grid-template-columns: repeat(3, minmax(0, 1fr));
gap: var(--space-sm);
}

.stat {
display: grid;
grid-template-columns: auto minmax(0, max-content);
align-items: baseline;
gap: 0.4rem;
border: 1px solid var(--accent-border);
border-radius: var(--radius-md);
padding: 0.58rem 0.65rem;
background: linear-gradient(145deg, var(--stat-bg), var(--accent-soft));
min-inline-size: 0;
}

.stat-label {
display: flex;
flex-wrap: nowrap;
align-items: center;
gap: var(--space-2xs);
min-inline-size: 0;
font-size: var(--text-sm);
white-space: nowrap;
}

.stat strong {
display: inline-block;
margin-block-start: 0;
font-size: var(--text-base);
line-height: 1.2;
font-weight: 760;
overflow-wrap: normal;
white-space: nowrap;
text-align: end;
}

.note,
.error {
font-size: var(--text-sm);
line-height: 1.45;
}

.note {
color: var(--muted);
}

.note p + p {
margin-block-start: var(--space-sm);
}

.header-copy p + p {
margin-block-start: 0;
}

.note code {
color: var(--fg);
}

.error {
color: var(--danger);
margin: 0;
}

.error:empty {
display: none;
}

.error:not(:empty) {
min-block-size: 1.45em;
}

code {
font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
font-size: .95em;
}

.tip {
position: relative;
display: inline-flex;
align-items: center;
vertical-align: middle;
}

.tip-icon {
display: inline-flex;
align-items: center;
justify-content: center;
inline-size: 1.15rem;
block-size: 1.15rem;
padding: 0;
border-radius: 999px;
border: 1px solid var(--accent-border);
background: var(--accent-soft);
color: var(--fg);
font-size: var(--text-xs);
font-weight: 760;
line-height: 1;
cursor: help;
user-select: none;
}

.tip-icon:hover {
background: var(--accent-soft);
}

.tip-icon:focus-visible {
outline: 2px solid var(--focus);
outline-offset: 2px;
}

.tip-content {
display: none;
position: absolute;
z-index: 10;
inset-inline-end: 0;
inset-block-end: calc(100% + var(--space-xs));
inline-size: min(17.5rem, calc(100dvw - (2 * var(--page-pad))));
padding: var(--space-xs) var(--space-sm);
border-radius: var(--radius-sm);
border: 1px solid var(--border);
background: var(--tooltip-bg);
color: var(--fg);
box-shadow: 0 clamp(0.5rem, .25rem + 1vw, .75rem) clamp(1.4rem, 1rem + 1.6vw, 1.9rem) var(--shadow);
font-size: var(--text-xs);
line-height: 1.35;
font-weight: 400;
opacity: 0;
visibility: hidden;
pointer-events: none;
transition: opacity 120ms ease, visibility 120ms ease;
}

.tip-content ul {
margin: var(--space-2xs) 0 0;
padding-inline-start: 1.15rem;
}

.tip-content li + li {
margin-block-start: .2rem;
}

.tip-content::after {
content: "";
position: absolute;
inset-inline-end: .45rem;
inset-block-start: 100%;
border: .45rem solid transparent;
border-block-start-color: var(--border);
}

.tip-below .tip-content {
inset-block-start: calc(100% + var(--space-xs));
inset-block-end: auto;
}

.tip-below .tip-content::after {
inset-block-start: auto;
inset-block-end: 100%;
border-block-start-color: transparent;
border-block-end-color: var(--border);
}

input[type="number"]:focus-visible,
input[type="text"]:focus-visible,
button:focus-visible,
a:focus-visible {
outline: 2px solid var(--focus);
outline-offset: 2px;
}

.tip:hover .tip-content,
.tip:focus-within .tip-content {
display: block;
opacity: 1;
visibility: visible;
}

@media (max-width: 58rem) {
.stats {
grid-template-columns: 1fr;
}

.stat {
grid-template-columns: auto minmax(0, max-content);
}
}

@media (max-width: 44rem) {
body {
padding: 0.75rem;
}

main {
gap: var(--space-sm);
}

h1 {
font-size: 1.7rem;
}

.card {
padding: var(--space-md);
}

h2 {
margin-block-end: var(--space-xs);
}

.header-content,
.settings-panel {
grid-template-columns: 1fr;
}

.header-content {
gap: var(--space-md);
text-align: center;
}

.top-controls {
flex-direction: row;
justify-content: center;
}

.group-options {
grid-template-columns: repeat(2, minmax(0, 1fr));
}

.group-option,
.stat {
padding: 0.58rem 0.65rem;
}

.stat-label {
font-size: var(--text-xs);
line-height: 1.25;
}

.stat strong {
font-size: var(--text-base);
}
}

@media (max-width: 34rem) {
.group-options {
grid-template-columns: 1fr;
}

.stat {
grid-template-columns: minmax(0, max-content) auto;
}
}
</style>
</head>

<body>
<main>
<header>

</div>

I18N["en-GB"] = {
...I18N["en-US"],
languageName: "English (UK)",
languageSelectAria: "Choose language"
};

let locale = readStoredLocale() || resolveLocale(navigator.languages || navigator.language || DEFAULT_LOCALE);
let text = I18N[locale] || I18N[DEFAULT_LOCALE];
let numberFormatter = new Intl.NumberFormat(locale);

const GROUPS = {
lower: charsFromRange(0x61, 0x7a),
upper: charsFromRange(0x41, 0x5a),
digits: charsFromRange(0x30, 0x39),
symbols: charsFromRanges([[0x21, 0x2f], [0x3a, 0x40], [0x5b, 0x60], [0x7b, 0x7e]])
};

const lengthInput = document.getElementById("length");
const passwordOutput = document.getElementById("password");
const errorOutput = document.getElementById("error");
const alphabetSizeOutput = document.getElementById("alphabetSize");
const entropyBitsOutput = document.getElementById("entropyBits");
const searchSpaceOutput = document.getElementById("searchSpace");
const paletteToggle = document.getElementById("paletteToggle");
const themeToggle = document.getElementById("themeToggle");
const languageSelect = document.getElementById("languageSelect");
const copyButton = document.getElementById("copy");
const themeMedia = window.matchMedia("(prefers-color-scheme: dark)");

let themeSource = "auto";
let copyResetTimer = 0;

translateUI();
applyStoredOrDefaultPalette();
applyStoredOrSystemTheme();

document.getElementById("generate").addEventListener("click", generateAndRender);

copyButton.addEventListener("click", copyPassword);
passwordOutput.addEventListener("click", copyPassword);

async function copyPassword() {
if (!passwordOutput.value) return;

try {
if (navigator.clipboard?.writeText) {
await navigator.clipboard.writeText(passwordOutput.value);
} else {
passwordOutput.focus();
passwordOutput.select();
document.execCommand("copy");
passwordOutput.setSelectionRange(0, 0);
}

copyButton.textContent = t("copiedButton");

clearTimeout(copyResetTimer);

copyResetTimer = window.setTimeout(() => {
copyButton.textContent = t("copyButton");
}, 1200);
} catch {
errorOutput.textContent = t("errorClipboard");
}
}

languageSelect.addEventListener("change", () => {
setLocale(languageSelect.value);
});

paletteToggle.addEventListener("click", () => {
const nextPalette = randomPalette(currentPalette());

try {
localStorage.setItem(PALETTE_STORAGE_KEY, nextPalette);
} catch {
}

applyPalette(nextPalette);
});

themeToggle.addEventListener("click", () => {
const nextTheme = currentTheme() === "dark" ? "light" : "dark";
themeSource = "manual";

try {
localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
} catch {
}

applyTheme(nextTheme);
});

themeMedia.addEventListener("change", () => {
themeSource = "auto";

try {
localStorage.removeItem(THEME_STORAGE_KEY);
} catch {
}

applyTheme(systemTheme());
});

document.querySelectorAll("input:not(#password)").forEach(input => {
input.addEventListener("input", generateAndRender);
input.addEventListener("change", generateAndRender);
});

generateAndRender();

function t(key, replacements = {}) {
let value = text[key] ?? I18N[DEFAULT_LOCALE][key] ?? key;

for (const [name, replacement] of Object.entries(replacements)) {
value = value.replaceAll(`{${name}}`, replacement);
}

return value;
}

function canonicalLocale(value) {
try {
return Intl.getCanonicalLocales(value)[0];
} catch {
return "";
}
}

function resolveLocale(languages) {
const candidates = Array.isArray(languages) ? languages : [languages];

for (const raw of candidates) {
const locale = canonicalLocale(raw);
if (SUPPORTED_LOCALES.includes(locale)) return locale;
}

for (const raw of candidates) {
const locale = canonicalLocale(raw);
const base = locale.split("-")[0];

if (base === "de") return "de-DE";
if (base === "en") return "en-US";
}

return DEFAULT_LOCALE;
}

function translateUI() {
document.documentElement.lang = locale;
document.title = t("documentTitle");
languageSelect.value = locale;

document.querySelectorAll("[data-i18n]").forEach(element => {
element.textContent = t(element.dataset.i18n);
});

document.querySelectorAll("[data-i18n-html]").forEach(element => {
element.innerHTML = t(element.dataset.i18nHtml);
});

document.querySelectorAll("[data-i18n-aria]").forEach(element => {
element.setAttribute("aria-label", t(element.dataset.i18nAria));
});

applyPalette(currentPalette());
}

function systemTheme() {
return themeMedia.matches ? "dark" : "light";
}

function currentTheme() {
return document.documentElement.dataset.theme === "dark" ? "dark" : "light";
}

function currentPalette() {
const palette = document.documentElement.dataset.palette;
return COLOR_PALETTES.includes(palette) ? palette : DEFAULT_PALETTE;
}

function readStoredLocale() {
try {
const stored = localStorage.getItem(LOCALE_STORAGE_KEY);
return SUPPORTED_LOCALES.includes(stored) ? stored : null;
} catch {
return null;
}
}

function setLocale(nextLocale) {
const safeLocale = SUPPORTED_LOCALES.includes(nextLocale) ? nextLocale : DEFAULT_LOCALE;
locale = safeLocale;
text = I18N[locale] || I18N[DEFAULT_LOCALE];
numberFormatter = new Intl.NumberFormat(locale);

try {
localStorage.setItem(LOCALE_STORAGE_KEY, locale);
} catch {
}

translateUI();
applyTheme(currentTheme());
renderDetailsOnly();
}

function readStoredTheme() {
try {
const stored = localStorage.getItem(THEME_STORAGE_KEY);
return stored === "dark" || stored === "light" ? stored : null;
} catch {
return null;
}
}

function readStoredPalette() {
try {
const stored = localStorage.getItem(PALETTE_STORAGE_KEY);
return COLOR_PALETTES.includes(stored) ? stored : null;
} catch {
return null;
}
}

function applyStoredOrDefaultPalette() {
applyPalette(readStoredPalette() || currentPalette());
}

function applyStoredOrSystemTheme() {
const storedTheme = readStoredTheme();

if (storedTheme) {
themeSource = "manual";
applyTheme(storedTheme);
return;
}

themeSource = "auto";
applyTheme(systemTheme());
}

function applyTheme(theme) {
const safeTheme = theme === "dark" ? "dark" : "light";

document.documentElement.dataset.theme = safeTheme;

const switchesToLight = safeTheme === "dark";

themeToggle.textContent = switchesToLight ? "☀" : "☾";
themeToggle.setAttribute("aria-pressed", String(safeTheme === "dark"));
themeToggle.setAttribute("aria-label", switchesToLight ? t("switchToLight") : t("switchToDark"));
themeToggle.setAttribute("title", switchesToLight ? t("switchToLight") : t("switchToDark"));
}

function randomPalette(current) {
const candidates = COLOR_PALETTES.filter(palette => palette !== current);
return candidates[randomBelow(candidates.length)];
}

function applyPalette(palette) {
const safePalette = COLOR_PALETTES.includes(palette) ? palette : DEFAULT_PALETTE;

document.documentElement.dataset.palette = safePalette;
paletteToggle.textContent = "◈";
paletteToggle.setAttribute("aria-pressed", "false");
paletteToggle.setAttribute("aria-label", t("randomColorLayout"));
paletteToggle.setAttribute("title", t("randomColorLayout"));
}

function charsFromRange(start, end) {
let out = "";
for (let cp = start; cp <= end; cp++) out += String.fromCodePoint(cp);
return out;
}

function charsFromRanges(ranges) {
return ranges.map(([start, end]) => charsFromRange(start, end)).join("");
}

function selectedGroups() {
return [...document.querySelectorAll(".group:checked")].map(input => ({
name: input.dataset.group,
chars: GROUPS[input.dataset.group]
}));
}

function makeAlphabet(groups) {
return [...new Set(groups.flatMap(group => [...group.chars]))].join("");
}

function randomBelow(maxExclusive) {
if (!Number.isSafeInteger(maxExclusive) || maxExclusive <= 0) {
throw new Error(t("errorRandomLimit"));
}

const maxUint32 = 0x100000000;
const limit = maxUint32 - (maxUint32 % maxExclusive);
const buffer = new Uint32Array(1);

while (true) {
crypto.getRandomValues(buffer);
const value = buffer[0];
if (value < limit) return value % maxExclusive;
}
}

function randomPasswordFromAlphabet(length, alphabet) {
let password = "";
for (let i = 0; i < length; i++) {
password += alphabet[randomBelow(alphabet.length)];
}
return password;
}

function containsEveryGroup(password, groups) {
return groups.every(group => [...password].some(char => group.chars.includes(char)));
}

function generatePassword(length, groups, alphabet) {
const maxAttempts = 100000;

for (let attempt = 0; attempt < maxAttempts; attempt++) {
const candidate = randomPasswordFromAlphabet(length, alphabet);
if (containsEveryGroup(candidate, groups)) return candidate;
}

throw new Error(t("errorAttempts"));
}

function entropyBits(length, groups) {
return log2ValidPasswordCount(length, groups.map(group => group.chars.length));
}

function log2ValidPasswordCount(length, groupSizes) {
const totalAlphabet = groupSizes.reduce((sum, size) => sum + size, 0);
const positiveTerms = [];
const negativeTerms = [];
const subsets = 1 << groupSizes.length;

for (let mask = 0; mask < subsets; mask++) {
let removed = 0;
let bits = 0;

for (let i = 0; i < groupSizes.length; i++) {
if (mask & (1 << i)) {
removed += groupSizes[i];
bits++;
}
}

const remaining = totalAlphabet - removed;
if (remaining <= 0) continue;

const logTerm = length * Math.log2(remaining);
if (bits % 2 === 0) positiveTerms.push(logTerm);
else negativeTerms.push(logTerm);
}

const pos = log2Sum(positiveTerms);
const neg = log2Sum(negativeTerms);
return log2Subtract(pos, neg);
}

function log2Sum(logValues) {
if (logValues.length === 0) return -Infinity;

const max = Math.max(...logValues);
const sum = logValues.reduce((acc, value) => acc + Math.pow(2, value - max), 0);

return max + Math.log2(sum);
}

function log2Subtract(logA, logB) {
if (logB === -Infinity) return logA;
if (logB >= logA) return -Infinity;
return logA + Math.log2(1 - Math.pow(2, logB - logA));
}

function formatSearchSpace(log2Count) {
const log10 = log2Count * Math.LOG10E * Math.LN2;
if (!Number.isFinite(log10)) return "-";
if (log10 < 6) return numberFormatter.format(Math.round(Math.pow(10, log10)));
return `≈ 10^${log10.toLocaleString(locale, {
minimumFractionDigits: 1,
maximumFractionDigits: 1
})}`;
}

function formatBits(bits) {
return `${bits.toLocaleString(locale, {
minimumFractionDigits: 2,
maximumFractionDigits: 2
})} Bit`;
}

function updatePasswordSize(value) {
const length = Math.max(1, value.length);
passwordOutput.size = Math.min(length, 128);
}

function renderDetailsOnly() {
try {
const length = Number(lengthInput.value);
const groups = selectedGroups();

if (!Number.isInteger(length) || length < 1 || length > 1000 || groups.length === 0 || length < groups.length) return;

const alphabet = makeAlphabet(groups);
const bits = entropyBits(length, groups);

alphabetSizeOutput.textContent = numberFormatter.format(alphabet.length);
entropyBitsOutput.textContent = formatBits(bits);
searchSpaceOutput.textContent = formatSearchSpace(bits);
} catch {
}
}

function generateAndRender() {
errorOutput.textContent = "";
copyButton.textContent = t("copyButton");

try {
if (!window.crypto || !crypto.getRandomValues) {
throw new Error(t("errorCrypto"));
}

const length = Number(lengthInput.value);
const groups = selectedGroups();
if (!Number.isInteger(length) || length < 1 || length > 1000) {
throw new Error(t("errorLength"));
}

if (groups.length === 0) {
throw new Error(t("errorGroup"));
}

if (length < groups.length) {
throw new Error(t("errorTooShort"));
}

const alphabet = makeAlphabet(groups);
const password = generatePassword(length, groups, alphabet);
const bits = entropyBits(length, groups);

passwordOutput.value = password;
updatePasswordSize(password);
alphabetSizeOutput.textContent = numberFormatter.format(alphabet.length);
entropyBitsOutput.textContent = formatBits(bits);
searchSpaceOutput.textContent = formatSearchSpace(bits);
} catch (err) {
errorOutput.textContent = err instanceof Error ? err.message : String(err);
passwordOutput.value = "";
updatePasswordSize("");
alphabetSizeOutput.textContent = "-";
entropyBitsOutput.textContent = "-";
searchSpaceOutput.textContent = "-";
}
}
</script></body></html>
